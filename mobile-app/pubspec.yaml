name: bikecomp_mobile
description: Android BLE configurator and dashboard for BikeComp.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_reactive_ble: ^5.5.0
  flutter_riverpod: 3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  permission_handler: ^12.0.3
  riverpod_annotation: 4.0.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  freezed: 3.2.6-dev.1
  json_serializable: ^6.14.0
  riverpod_generator: 4.0.4
  mocktail: ^1.0.4
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true
