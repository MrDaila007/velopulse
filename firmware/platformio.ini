[platformio]
default_envs = xiao_ble_sense

[env:xiao_ble_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#e198580619bfcbe75a7089cd9a6e70e09116a860
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
upload_protocol = nrfutil
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I include
    -DFW_VERSION=\"0.2.0\"
    -DPROTO_MAJOR=1
    -DPROTO_MINOR=1
    -DHW_REVISION=1
    -DBOARD_SUPER_NRF52840=1
    -DBIKECOMP_AMBIENT_LIGHT=1
    -DBIKECOMP_AMBIENT_RAW_DARK=266
    -DBIKECOMP_AMBIENT_RAW_BRIGHT=1126
    -DBIKECOMP_SUPPRESS_BOARD_LEDS=1
    -DBIKECOMP_STATUS_LED_PULSE_MS=4
    -DBIKECOMP_STATUS_LED_INTERVAL_MS=12000
    -DBIKECOMP_HALL_PULLUP=1
    -DBIKECOMP_HALL_TWO_WIRE=1
    -DBIKECOMP_HALL_ACTIVE_EDGE=0
    -DBIKECOMP_HALL_ANALOG=0
build_src_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -Wno-unused-parameter
    -Wno-unused-function
    -Wno-unused-variable
lib_deps =
    olikraus/U8g2 @ 2.35.30
test_framework = unity
test_filter = test_embedded

[env:xiao_ble_sense_deep_sleep]
extends = env:xiao_ble_sense
build_flags =
    ${env:xiao_ble_sense.build_flags}
    -DBIKECOMP_FEATURE_DEEP_SLEEP=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror=return-type
    -Wno-unused-parameter
    -Wno-unused-function
    -Wno-unused-variable
    -DUNIT_TEST
    -I include
    -I lib/domain
    '-DPROTOCOL_FIXTURES_DIR="${PROJECT_DIR}/../protocol/fixtures"'
test_filter = test_native

[env:xiao_ble_sense_128x32]
extends = env:xiao_ble_sense
build_flags =
    ${env:xiao_ble_sense.build_flags}
    -DBIKECOMP_DISPLAY_HEIGHT=32
