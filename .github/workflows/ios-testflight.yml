name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build and upload iOS
    runs-on: macos-latest
    environment: ios-testflight
    env:
      FLUTTER_VERSION: "3.44.7"
      IOS_BUNDLE_ID: app.bikecomp.mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze

      - name: Run tests
        working-directory: mobile-app
        run: flutter test

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          profile_path="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_path"
          echo "$IOS_PROVISIONING_PROFILE" | openssl base64 -d -A \
            > "$profile_path/bikecomp.mobile.mobileprovision"

      - name: Build signed IPA
        working-directory: mobile-app
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Stage IPA artifact
        run: |
          mkdir -p release/ios
          cp mobile-app/build/ios/ipa/*.ipa "release/ios/bikecomp-mobile-${{ github.ref_name }}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-ipa
          retention-days: 400
          if-no-files-found: error
          path: release/ios/*.ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: mobile-app/build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
