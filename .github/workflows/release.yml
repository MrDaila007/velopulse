name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version manifest is synced
        working-directory: .
        run: |
          python3 tools/sync_versions.py
          git diff --exit-code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run native tests
        run: pio test -e native

      - name: Build production firmware
        run: pio run -e xiao_ble_sense -e xiao_ble_sense_128x32

      - name: Stage firmware release files
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p release/firmware-128x64 release/firmware-128x32
          cp firmware/.pio/build/xiao_ble_sense/firmware.hex \
            firmware/.pio/build/xiao_ble_sense/firmware.elf \
            firmware/.pio/build/xiao_ble_sense/firmware.zip \
            release/firmware-128x64/
          cp firmware/.pio/build/xiao_ble_sense_128x32/firmware.hex \
            firmware/.pio/build/xiao_ble_sense_128x32/firmware.elf \
            firmware/.pio/build/xiao_ble_sense_128x32/firmware.zip \
            release/firmware-128x32/
          printf '%s\n' "${{ github.ref_name }}" > release/VERSION.txt

      - name: Upload firmware release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          retention-days: 400
          if-no-files-found: error
          path: release/

  firmware-zephyr:
    name: Firmware Zephyr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake gcc g++

      - name: Cache Zephyr tree
        uses: actions/cache@v4
        id: zephyr-cache
        with:
          path: zephyr
          key: zephyr-v4.4.0-${{ runner.os }}

      - name: Fetch Zephyr
        if: steps.zephyr-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch v4.4.0 https://github.com/zephyrproject-rtos/zephyr.git zephyr

      - name: Install Zephyr Python dependencies
        run: pip install -r zephyr/scripts/requirements.txt

      - name: Cache Zephyr SDK
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: zephyr-sdk-1.0.0
          key: zephyr-sdk-1.0.0-linux-x86_64-minimal

      - name: Install Zephyr SDK (arm-zephyr-eabi)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o sdk.tar.xz \
            https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.0/zephyr-sdk-1.0.0_linux-x86_64_minimal.tar.xz
          mkdir -p zephyr-sdk-1.0.0
          tar xf sdk.tar.xz -C zephyr-sdk-1.0.0 --strip-components=1
          yes | zephyr-sdk-1.0.0/setup.sh -c -t arm-zephyr-eabi

      - name: Run ztest domain suite
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
          ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/zephyr-sdk-1.0.0
        run: firmware-zephyr/scripts/test.sh

  mobile-app:
    name: Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip curl

      - name: Cache mobile toolchain
        uses: actions/cache@v4
        with:
          path: .tooling
          key: mobile-toolchain-${{ runner.os }}-${{ hashFiles('tool/bootstrap-mobile.sh') }}
          restore-keys: |
            mobile-toolchain-${{ runner.os }}-

      - name: Bootstrap mobile toolchain
        run: ./tool/bootstrap-mobile.sh

      - name: Install dependencies
        working-directory: mobile-app
        run: ../tool/flutterw pub get

      - name: Analyze
        working-directory: mobile-app
        run: ../tool/flutterw analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile-app
        run: ../tool/flutterw test

      - name: Build release APK
        working-directory: mobile-app
        run: ../tool/flutterw build apk --release

      - name: Stage mobile release file
        run: |
          mkdir -p release
          cp mobile-app/build/app/outputs/flutter-apk/app-release.apk \
            "release/bikecomp-mobile-${{ github.ref_name }}.apk"

      - name: Upload mobile release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-mobile
          retention-days: 400
          if-no-files-found: error
          path: release/

  publish:
    name: Publish GitHub Release
    needs: [firmware, firmware-zephyr, mobile-app]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: dist/firmware

      - name: Download mobile bundle
        uses: actions/download-artifact@v4
        with:
          name: release-mobile
          path: dist/mobile

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          body_path: CHANGELOG.md
          files: |
            dist/firmware/**/*
            dist/mobile/**/*
