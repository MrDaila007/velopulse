# BikeComp Zephyr build (parity target: Arduino firmware STATUS.md 2026-08-01)

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

CONFIG_FW_VERSION="0.2.0-zephyr"
CONFIG_BIKECOMP_DISPLAY_HEIGHT=64
CONFIG_BIKECOMP_AMBIENT_LIGHT=y
CONFIG_BIKECOMP_OPEN_PAIRING=n
CONFIG_BIKECOMP_HOTPATH_SERIAL=n
CONFIG_BIKECOMP_ZEPHYR_BLE_STUB=n
CONFIG_BIKECOMP_ZEPHYR_DISPLAY_STUB=n
CONFIG_BIKECOMP_DEEP_SLEEP=y
